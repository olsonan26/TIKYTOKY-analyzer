name: tikytoky-local-research

services:
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run searxng-start.ps1 to generate the private local secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./.data/searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 6
      start_period: 30s

