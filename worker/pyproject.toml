[project]
name = "tikytoky-worker"
version = "0.1.0"
description = "Persistent local research worker for the TIKY TOKY Vercel dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
  "browser-use==0.13.11",
  "TikTokApi==7.3.3",
  "faster-whisper==1.2.1",
  "av==16.1.0",
  "yt-dlp==2026.8.19",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "filelock>=3.16,<4"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
